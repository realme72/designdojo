config:
  notes: {2000: 2, 500: 4, 100: 10}
  accounts: [{card: C1, pin: "1234", balance: 10000}, {card: C2, pin: "0000", balance: 300}]
scenarios:
  - name: withdraw_happy_path
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1234"}}
      - {call: withdraw, args: {amount: 2600}, expect: [{value: 2000, count: 1}, {value: 500, count: 1}, {value: 100, count: 1}]}
      - {call: balance, expect: 7400}
      - {call: cash, expect: 4400}
  - name: wrong_pin
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "9999"}, expect_error: WrongPin}
      - {call: balance, expect_error: InvalidState}
  - name: insufficient_funds
    steps:
      - {call: insert_card, args: {card: C2}}
      - {call: enter_pin, args: {pin: "0000"}}
      - {call: withdraw, args: {amount: 500}, expect_error: InsufficientFunds}
