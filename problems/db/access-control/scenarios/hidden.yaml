scenarios:
  - name: who_can_and_duplicates
    steps:
      - {op: add_user, args: {name: Zed}, bind: z}
      - {op: add_user, args: {name: Amy}, bind: a}
      - {op: add_user, args: {name: Max}, bind: m}
      - {op: add_role, args: {name: ops}, bind: ops}
      - {op: add_role, args: {name: sre}, bind: sre}
      - {op: add_role, args: {name: ops}, expect_error: unique_violation}
      - {op: add_permission, args: {resource: server, action: restart}, bind: p}
      - {op: add_permission, args: {resource: server, action: restart}, expect_error: unique_violation}
      - {op: grant, args: {role_id: $ops.id, permission_id: $p.id}}
      - {op: grant, args: {role_id: $ops.id, permission_id: $p.id}, expect_error: rejected}
      - {op: inherit, args: {role_id: $sre.id, parent_id: $ops.id}}
      - {op: assign, args: {user_id: $z.id, role_id: $sre.id}}
      - {op: assign, args: {user_id: $a.id, role_id: $ops.id}}
      - {op: assign, args: {user_id: $a.id, role_id: $sre.id}}
      - {op: assign, args: {user_id: $a.id, role_id: $sre.id}, expect_error: rejected}
      - {op: who_can, args: {resource: server, action: restart}, expect: [{name: Amy}, {name: Zed}]}
      - {op: permissions_of, args: {user_id: $m.id}, expect: []}
      - {op: can, args: {user_id: $m.id, resource: server, action: restart}, expect: false}
  - name: diamond_hierarchy
    steps:
      - {op: add_user, args: {name: Ann}, bind: u}
      - {op: add_role, args: {name: base}, bind: base}
      - {op: add_role, args: {name: left}, bind: l}
      - {op: add_role, args: {name: right}, bind: r}
      - {op: add_role, args: {name: top}, bind: t}
      - {op: add_permission, args: {resource: x, action: y}, bind: p}
      - {op: grant, args: {role_id: $base.id, permission_id: $p.id}}
      - {op: inherit, args: {role_id: $l.id, parent_id: $base.id}}
      - {op: inherit, args: {role_id: $r.id, parent_id: $base.id}}
      - {op: inherit, args: {role_id: $t.id, parent_id: $l.id}}
      - {op: inherit, args: {role_id: $t.id, parent_id: $r.id}}
      - {op: assign, args: {user_id: $u.id, role_id: $t.id}}
      - {op: permissions_of, args: {user_id: $u.id}, expect: [{resource: x, action: y}]}
      - {op: inherit, args: {role_id: $base.id, parent_id: $t.id}, expect_error: rejected}
