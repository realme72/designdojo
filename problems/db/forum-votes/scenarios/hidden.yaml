scenarios:
  - name: vote_values_and_unvote
    steps:
      - {op: add_user, args: {username: ann}, bind: ann}
      - {op: add_user, args: {username: bob}, bind: bob}
      - {op: add_community, args: {name: x}, bind: c}
      - {op: create_post, args: {community_id: $c.id, user_id: $ann.id, title: T, created_at: "2030-01-01T10:00:00Z"}, bind: p}
      - {op: vote, args: {user_id: $bob.id, post_id: $p.id, value: 2}, expect_error: rejected}
      - {op: vote, args: {user_id: $bob.id, post_id: $p.id, value: 0}, expect_error: rejected}
      - {op: vote, args: {user_id: $bob.id, post_id: $p.id, value: 1}}
      - {op: vote, args: {user_id: $bob.id, post_id: $p.id, value: 1}}
      - {op: karma, args: {user_id: $ann.id}, expect: 1}
      - {op: unvote, args: {user_id: $bob.id, post_id: $p.id}}
      - {op: karma, args: {user_id: $ann.id}, expect: 0}
      - {op: karma, args: {user_id: $bob.id}, expect: 0}
  - name: deep_tree
    steps:
      - {op: add_user, args: {username: ann}, bind: u}
      - {op: add_community, args: {name: x}, bind: c}
      - {op: create_post, args: {community_id: $c.id, user_id: $u.id, title: T, created_at: "2030-01-01T10:00:00Z"}, bind: p}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: null, body: a}, bind: a}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: $a.id, body: a1}, bind: a1}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: null, body: b}, bind: b}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: $a1.id, body: a1x}}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: $a.id, body: a2}}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: $b.id, body: b1}}
      - {op: comment_tree, args: {post_id: $p.id}, expect: [{body: a, depth: 0}, {body: a1, depth: 1}, {body: a1x, depth: 2}, {body: a2, depth: 1}, {body: b, depth: 0}, {body: b1, depth: 1}]}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: null, body: "  "}, expect_error: rejected}
      - {op: comment, args: {post_id: $p.id, user_id: $u.id, parent_id: 999999, body: ghost}, expect_error: rejected}
  - name: ranking_ties_and_scope
    steps:
      - {op: add_user, args: {username: ann}, bind: u}
      - {op: add_user, args: {username: bob}, bind: v}
      - {op: add_community, args: {name: x}, bind: c}
      - {op: add_community, args: {name: y}, bind: d}
      - {op: add_community, args: {name: x}, expect_error: unique_violation}
      - {op: create_post, args: {community_id: $c.id, user_id: $u.id, title: old, created_at: "2030-01-01T10:00:00Z"}, bind: o}
      - {op: create_post, args: {community_id: $c.id, user_id: $u.id, title: new, created_at: "2030-01-05T10:00:00Z"}, bind: n}
      - {op: create_post, args: {community_id: $d.id, user_id: $u.id, title: elsewhere, created_at: "2030-01-09T10:00:00Z"}, bind: e}
      - {op: vote, args: {user_id: $v.id, post_id: $o.id, value: 1}}
      - {op: vote, args: {user_id: $v.id, post_id: $n.id, value: 1}}
      - {op: vote, args: {user_id: $v.id, post_id: $e.id, value: 1}}
      - {op: top_posts, args: {community_id: $c.id, n: 5}, expect: [{title: new, score: 1}, {title: old, score: 1}]}
      - {op: top_posts, args: {community_id: $c.id, n: 1}, expect: [{title: new}]}
      - {op: karma, args: {user_id: $u.id}, expect: 3}
