scenarios:
  - name: votes_change_and_rank
    steps:
      - {op: add_user, args: {username: ann}, bind: ann}
      - {op: add_user, args: {username: bob}, bind: bob}
      - {op: add_community, args: {name: databases}, bind: c}
      - {op: create_post, args: {community_id: $c.id, user_id: $ann.id, title: Postgres tips, created_at: "2030-01-01T10:00:00Z"}, bind: p1}
      - {op: create_post, args: {community_id: $c.id, user_id: $bob.id, title: Indexes, created_at: "2030-01-02T10:00:00Z"}, bind: p2}
      - {op: vote, args: {user_id: $bob.id, post_id: $p1.id, value: 1}}
      - {op: vote, args: {user_id: $ann.id, post_id: $p1.id, value: 1}}
      - {op: top_posts, args: {community_id: $c.id, n: 10}, expect: [{title: Postgres tips, score: 2}, {title: Indexes, score: 0}]}
      - {op: vote, args: {user_id: $bob.id, post_id: $p1.id, value: -1}}
      - {op: vote, args: {user_id: $ann.id, post_id: $p1.id, value: -1}}
      - {op: top_posts, args: {community_id: $c.id, n: 10}, expect: [{title: Indexes, score: 0}, {title: Postgres tips, score: -2}]}
      - {op: karma, args: {user_id: $ann.id}, expect: -2}
  - name: comment_tree_same_post
    steps:
      - {op: add_user, args: {username: ann}, bind: ann}
      - {op: add_community, args: {name: databases}, bind: c}
      - {op: create_post, args: {community_id: $c.id, user_id: $ann.id, title: A, created_at: "2030-01-01T10:00:00Z"}, bind: a}
      - {op: create_post, args: {community_id: $c.id, user_id: $ann.id, title: B, created_at: "2030-01-01T10:00:00Z"}, bind: b}
      - {op: comment, args: {post_id: $a.id, user_id: $ann.id, parent_id: null, body: first}, bind: c1}
      - {op: comment, args: {post_id: $a.id, user_id: $ann.id, parent_id: null, body: second}, bind: c2}
      - {op: comment, args: {post_id: $a.id, user_id: $ann.id, parent_id: $c1.id, body: reply}}
      - {op: comment, args: {post_id: $b.id, user_id: $ann.id, parent_id: $c1.id, body: wrong post}, expect_error: rejected}
      - {op: comment_tree, args: {post_id: $a.id}, expect: [{body: first, depth: 0}, {body: reply, depth: 1}, {body: second, depth: 0}]}
