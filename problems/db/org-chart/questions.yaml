- id: storage_choice
  stage: before
  question: An HR system with a deep org hierarchy - relational database or graph database? Why?
  points:
    - text: Relational fits well - the hierarchy is a tree with modest depth, queried with recursive CTEs, alongside lots of tabular HR data.
      keywords: [relational, tree, recursive, cte, tabular]
    - text: Graph databases shine for arbitrary many-to-many traversal at depth; an org chart rarely needs that.
      keywords: [graph, traversal, neo4j, not needed, overkill]
    - text: Salaries and HR data need strict access control and auditing.
      keywords: [access control, audit, sensitive, permission]
  follow_up: Matrix organizations - people with two managers. What changes?
- id: hierarchy_queries
  stage: design
  question: How do you find everyone under a manager, at any depth?
  points:
    - text: WITH RECURSIVE starting from the manager's direct reports and joining down on manager_id.
      keywords: [recursive, with recursive, cte, manager_id]
    - text: Alternatives for read-heavy trees - materialized path (ltree), nested sets, or a closure table.
      keywords: [materialized path, ltree, nested set, closure table]
    - text: Index manager_id so each recursion step is an index lookup.
      keywords: [index, manager_id]
  follow_up: Which alternative makes "move a whole team under a new manager" cheapest?
- id: top_n
  stage: design
  question: "\"Top 3 salaries per department\" - ROW_NUMBER, RANK or DENSE_RANK? What's the difference?"
  points:
    - text: ROW_NUMBER gives unique positions (drops ties arbitrarily).
      keywords: [row_number, unique, arbitrary, ties dropped]
    - text: RANK leaves gaps after ties (1, 1, 3); DENSE_RANK doesn't (1, 1, 2).
      keywords: [rank, gaps, dense_rank, 1, 1, 2]
    - text: "\"Top 3 distinct salaries\" is DENSE_RANK <= 3, partitioned by department."
      keywords: [dense_rank, partition by, distinct, <= 3]
  follow_up: How would you write "Nth highest salary" without window functions?
