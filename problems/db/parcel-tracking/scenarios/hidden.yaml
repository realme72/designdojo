scenarios:
  - name: failed_attempt_and_after_delivery
    steps:
      - {op: create_shipment, args: {tracking_no: T, origin: A, destination: B, at: "2030-01-01T00:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: PICKED_UP, location: A, at: "2030-01-01T01:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: IN_TRANSIT, location: hub, at: "2030-01-01T02:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: OUT_FOR_DELIVERY, location: B, at: "2030-01-01T03:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: IN_TRANSIT, location: B hub, at: "2030-01-01T04:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: OUT_FOR_DELIVERY, location: B, at: "2030-01-02T03:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: DELIVERED, location: B, at: "2030-01-02T03:00:00Z"}}
      - {op: scan, args: {tracking_no: T, status: IN_TRANSIT, location: B, at: "2030-01-02T05:00:00Z"}, expect_error: rejected}
      - {op: scan, args: {tracking_no: NOPE, status: PICKED_UP, location: B, at: "2030-01-02T05:00:00Z"}, expect_error: rejected}
      - {op: create_shipment, args: {tracking_no: T, origin: A, destination: B, at: "2030-01-03T00:00:00Z"}, expect_error: unique_violation}
  - name: stuck_and_lanes
    steps:
      - {op: create_shipment, args: {tracking_no: S1, origin: A, destination: B, at: "2030-01-01T00:00:00Z"}}
      - {op: create_shipment, args: {tracking_no: S2, origin: A, destination: B, at: "2030-01-01T00:00:00Z"}}
      - {op: create_shipment, args: {tracking_no: S3, origin: A, destination: C, at: "2030-01-01T00:00:00Z"}}
      - {op: scan, args: {tracking_no: S1, status: PICKED_UP, location: A, at: "2030-01-01T06:00:00Z"}}
      - {op: scan, args: {tracking_no: S2, status: PICKED_UP, location: A, at: "2030-01-01T01:00:00Z"}}
      - {op: scan, args: {tracking_no: S2, status: IN_TRANSIT, location: A, at: "2030-01-01T02:00:00Z"}}
      - {op: scan, args: {tracking_no: S2, status: OUT_FOR_DELIVERY, location: B, at: "2030-01-01T03:00:00Z"}}
      - {op: scan, args: {tracking_no: S2, status: DELIVERED, location: B, at: "2030-01-01T09:00:00Z"}}
      - {op: stuck, args: {at: "2030-01-01T12:00:00Z", hours: 5}, expect: [{tracking_no: S1, status: PICKED_UP}, {tracking_no: S3, status: CREATED}]}
      - {op: stuck, args: {at: "2030-01-01T12:00:00Z", hours: 8}, expect: [{tracking_no: S3}]}
      - {op: avg_delivery_hours, args: {origin: A, destination: B}, expect: 9}
      - {op: avg_delivery_hours, args: {origin: A, destination: C}, expect: null}
