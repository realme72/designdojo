scenarios:
  - name: feed_counts_dont_multiply
    steps:
      - {op: add_user, args: {username: ann}, bind: ann}
      - {op: add_user, args: {username: bob}, bind: bob}
      - {op: add_user, args: {username: cy}, bind: cy}
      - {op: follow, args: {follower_id: $ann.id, followee_id: $bob.id}}
      - {op: create_post, args: {user_id: $bob.id, caption: sunset, posted_at: "2030-01-01T10:00:00Z"}, bind: p1}
      - {op: create_post, args: {user_id: $bob.id, caption: coffee, posted_at: "2030-01-02T09:00:00Z"}, bind: p2}
      - {op: create_post, args: {user_id: $ann.id, caption: mine, posted_at: "2030-01-03T09:00:00Z"}}
      - {op: like, args: {user_id: $ann.id, post_id: $p1.id}}
      - {op: like, args: {user_id: $cy.id, post_id: $p1.id}}
      - {op: comment, args: {user_id: $cy.id, post_id: $p1.id, body: wow}}
      - {op: comment, args: {user_id: $ann.id, post_id: $p1.id, body: nice}}
      - {op: comment, args: {user_id: $bob.id, post_id: $p1.id, body: thanks}}
      - {op: feed, args: {user_id: $ann.id, n: 10}, expect: [{caption: coffee, author: bob, likes: 0, comments: 0}, {caption: sunset, likes: 2, comments: 3}]}
  - name: rules_enforced
    steps:
      - {op: add_user, args: {username: ann}, bind: ann}
      - {op: add_user, args: {username: ANN}, expect_error: unique_violation}
      - {op: add_user, args: {username: bob}, bind: bob}
      - {op: follow, args: {follower_id: $ann.id, followee_id: $ann.id}, expect_error: rejected}
      - {op: follow, args: {follower_id: $ann.id, followee_id: $bob.id}}
      - {op: follow, args: {follower_id: $ann.id, followee_id: $bob.id}, expect_error: rejected}
      - {op: create_post, args: {user_id: $bob.id, caption: hi, posted_at: "2030-01-01T10:00:00Z"}, bind: p}
      - {op: like, args: {user_id: $ann.id, post_id: $p.id}}
      - {op: like, args: {user_id: $ann.id, post_id: $p.id}, expect_error: rejected}
      - {op: comment, args: {user_id: $ann.id, post_id: $p.id, body: "   "}, expect_error: rejected}
