seed: |
  insert into accounts values (1, 'Ann'), (2, 'Bob');
  insert into transactions values
    (1, 1, '2030-01-01 09:00Z', 100), (2, 1, '2030-01-01 18:00Z', -30), (3, 1, '2030-01-03 10:00Z', -80),
    (4, 1, '2030-01-03 10:00Z', 50), (5, 2, '2030-01-02 10:00Z', -5), (6, 2, '2030-01-05 10:00Z', -1);
scenarios:
  - name: statement_and_as_of
    steps:
      - {op: statement, args: {account_id: 1}, expect: [{amount: 100, balance: 100}, {amount: -30, balance: 70}, {amount: -80, balance: -10}, {amount: 50, balance: 40}]}
      - {op: balance_as_of, args: {account_id: 1, at: "2030-01-02T00:00:00Z"}, expect: 70}
      - {op: balance_as_of, args: {account_id: 1, at: "2029-12-31T00:00:00Z"}, expect: 0}
  - name: closing_and_overdrafts
    steps:
      - {op: daily_closing, args: {account_id: 1, from_day: "2030-01-01", to_day: "2030-01-04"}, expect: [{day: "2030-01-01", balance: 70}, {day: "2030-01-02", balance: 70}, {day: "2030-01-03", balance: 40}, {day: "2030-01-04", balance: 40}]}
      - {op: first_overdraft, args: {}, expect: [{owner: Ann, posted_at: "2030-01-03T10:00:00+00:00"}, {owner: Bob, posted_at: "2030-01-02T10:00:00+00:00"}]}
