  insert into reviews values
    (1, 1, 1, 5, '2030-01-01Z'), (2, 1, 2, 4, '2030-01-02Z'),
    (3, 2, 1, 5, '2030-01-01Z'), (4, 2, 3, 4, '2030-01-05Z'),
    (5, 3, 4, 5, '2030-01-03Z'),
    (6, 4, 1, 3, '2030-01-01Z'), (7, 4, 2, 3, '2030-01-01Z');
scenarios:
