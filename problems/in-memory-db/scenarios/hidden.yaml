scenarios:
  - name: order_by_and_limit
    steps:
      - {call: create_table, args: {name: t, columns: [id, city], primary_key: id}}
      - {call: insert, args: {table: t, row: {id: "3", city: b}}}
      - {call: insert, args: {table: t, row: {id: "1", city: c}}}
      - {call: insert, args: {table: t, row: {id: "2", city: b}}}
      - {call: insert, args: {table: t, row: {id: "4", city: a}}}
      - {call: select, args: {table: t, where: {}, order_by: city, limit: 0}, expect: [{id: "4"}, {id: "2"}, {id: "3"}, {id: "1"}]}
      - {call: select, args: {table: t, where: {}, order_by: city, limit: 2}, expect: [{id: "4"}, {id: "2"}]}
      - {call: select, args: {table: t, where: {}, order_by: "", limit: -1}, expect_error: InvalidQuery}
  - name: multi_column_where
    steps:
      - {call: create_table, args: {name: t, columns: [id, a, b], primary_key: id}}
      - {call: insert, args: {table: t, row: {id: "1", a: x, b: y}}}
      - {call: insert, args: {table: t, row: {id: "2", a: x, b: z}}}
      - {call: select, args: {table: t, where: {a: x, b: z}, order_by: "", limit: 0}, expect: [{id: "2"}]}
      - {call: select, args: {table: t, where: {a: nope}, order_by: "", limit: 0}, expect: []}
  - name: schema_errors
    steps:
      - {call: create_table, args: {name: t, columns: [], primary_key: id}, expect_error: InvalidSchema}
      - {call: create_table, args: {name: t, columns: [a, a], primary_key: a}, expect_error: InvalidSchema}
      - {call: create_table, args: {name: t, columns: [a], primary_key: b}, expect_error: InvalidSchema}
      - {call: create_table, args: {name: t, columns: [a], primary_key: a}}
      - {call: create_table, args: {name: t, columns: [a], primary_key: a}, expect_error: DuplicateTable}
  - name: row_and_column_errors
    steps:
      - {call: create_table, args: {name: t, columns: [k, v], primary_key: k}}
      - {call: insert, args: {table: t, row: {k: a}}, expect_error: InvalidRow}
      - {call: insert, args: {table: t, row: {k: a, v: b, extra: c}}, expect_error: InvalidRow}
      - {call: insert, args: {table: q, row: {k: a}}, expect_error: UnknownTable}
      - {call: select, args: {table: t, where: {zz: a}, order_by: "", limit: 0}, expect_error: UnknownColumn}
      - {call: select, args: {table: t, where: {}, order_by: zz, limit: 0}, expect_error: UnknownColumn}
      - {call: update, args: {table: t, where: {}, values: {zz: a}}, expect_error: UnknownColumn}
      - {call: create_index, args: {table: t, column: zz}, expect_error: UnknownColumn}
  - name: update_primary_key_collision_is_atomic
    steps:
      - {call: create_table, args: {name: t, columns: [k, v], primary_key: k}}
      - {call: insert, args: {table: t, row: {k: a, v: "1"}}}
      - {call: insert, args: {table: t, row: {k: b, v: "1"}}}
      - {call: insert, args: {table: t, row: {k: c, v: "2"}}}
      - {call: update, args: {table: t, where: {v: "1"}, values: {k: z}}, expect_error: DuplicateKey}
      - {call: update, args: {table: t, where: {k: a}, values: {k: c}}, expect_error: DuplicateKey}
      - {call: select, args: {table: t, where: {}, order_by: "", limit: 0}, expect: [{k: a}, {k: b}, {k: c}]}
      - {call: update, args: {table: t, where: {k: a}, values: {k: aa, v: "9"}}, expect: 1}
      - {call: select, args: {table: t, where: {k: aa}, order_by: "", limit: 0}, expect: [{k: aa, v: "9"}]}
  - name: index_stays_consistent
    steps:
      - {call: create_table, args: {name: t, columns: [id, city], primary_key: id}}
      - {call: insert, args: {table: t, row: {id: "1", city: blr}}}
      - {call: create_index, args: {table: t, column: city}}
      - {call: insert, args: {table: t, row: {id: "2", city: blr}}}
      - {call: update, args: {table: t, where: {id: "1"}, values: {city: del}}}
      - {call: select, args: {table: t, where: {city: blr}, order_by: "", limit: 0}, expect: [{id: "2"}]}
      - {call: select, args: {table: t, where: {city: del}, order_by: "", limit: 0}, expect: [{id: "1"}]}
      - {call: delete, args: {table: t, where: {city: blr}}, expect: 1}
      - {call: select, args: {table: t, where: {city: blr}, order_by: "", limit: 0}, expect: []}
  - name: delete_all_and_reinsert
    steps:
      - {call: create_table, args: {name: t, columns: [k], primary_key: k}}
      - {call: insert, args: {table: t, row: {k: a}}}
      - {call: insert, args: {table: t, row: {k: b}}}
      - {call: delete, args: {table: t, where: {}}, expect: 2}
      - {call: insert, args: {table: t, row: {k: a}}}
      - {call: delete, args: {table: t, where: {k: zz}}, expect: 0}
  - name: string_ordering
    steps:
      - {call: create_table, args: {name: t, columns: [id], primary_key: id}}
      - {call: insert, args: {table: t, row: {id: "10"}}}
      - {call: insert, args: {table: t, row: {id: "9"}}}
      - {call: insert, args: {table: t, row: {id: "100"}}}
      - {call: select, args: {table: t, where: {}, order_by: "", limit: 0}, expect: [{id: "10"}, {id: "100"}, {id: "9"}]}
