scenarios:
  - name: premium_seats_and_fares
    steps:
      - {call: add_flight, args: {flight_id: F, origin: A, destination: B, departs_at: 1700100000, seats: {ECONOMY: 4, PREMIUM_ECONOMY: 4, BUSINESS: 2}, fares: {ECONOMY: 100, PREMIUM_ECONOMY: 300, BUSINESS: 900}}}
      - {call: book, args: {passenger: a, flight_id: F, seat_class: PREMIUM_ECONOMY, count: 2}, expect: {seats: [P1, P2], total: 600}}
      - {call: book, args: {passenger: b, flight_id: F, seat_class: PREMIUM_ECONOMY, count: 1}, expect: {seats: [P3], total: 360}}
  - name: premium_search_and_missing_cabin
    steps:
      - {call: add_flight, args: {flight_id: F1, origin: A, destination: B, departs_at: 1700100000, seats: {ECONOMY: 4, BUSINESS: 2}, fares: {ECONOMY: 100, BUSINESS: 900}}}
      - {call: add_flight, args: {flight_id: F2, origin: A, destination: B, departs_at: 1700200000, seats: {PREMIUM_ECONOMY: 1}, fares: {PREMIUM_ECONOMY: 300}}}
      - {call: search, args: {origin: A, destination: B, seat_class: PREMIUM_ECONOMY, count: 1, start: 0, end: 1800000000}, expect: [F2]}
      - {call: book, args: {passenger: a, flight_id: F1, seat_class: PREMIUM_ECONOMY, count: 1}, expect_error: NotEnoughSeats}
  - name: premium_cancel_frees_seat
    steps:
      - {call: add_flight, args: {flight_id: F, origin: A, destination: B, departs_at: 1700100000, seats: {PREMIUM_ECONOMY: 1}, fares: {PREMIUM_ECONOMY: 300}}}
      - {call: book, args: {passenger: a, flight_id: F, seat_class: PREMIUM_ECONOMY, count: 1}, bind: x}
      - {call: cancel, args: {pnr: $x.pnr}, expect: 300}
      - {call: book, args: {passenger: b, flight_id: F, seat_class: PREMIUM_ECONOMY, count: 1}, expect: {seats: [P1]}}
