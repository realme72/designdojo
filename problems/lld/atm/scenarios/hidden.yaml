config:
  notes: {2000: 2, 500: 4, 100: 10}
  accounts: [{card: C1, pin: "1234", balance: 10000}, {card: C2, pin: "0000", balance: 300}]
scenarios:
  - name: third_wrong_pin_blocks_card
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "2"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "3"}, expect_error: CardBlocked}
      - {call: enter_pin, args: {pin: "1234"}, expect_error: InvalidState}
      - {call: insert_card, args: {card: C1}, expect_error: CardBlocked}
      - {call: insert_card, args: {card: C2}}
  - name: wrong_pins_count_across_sessions
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "2"}, expect_error: WrongPin}
      - {call: eject}
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "3"}, expect_error: CardBlocked}
  - name: correct_pin_resets_attempts
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "2"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "1234"}}
      - {call: eject}
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}, expect_error: WrongPin}
      - {call: enter_pin, args: {pin: "1234"}}
  - name: state_rules
    steps:
      - {call: balance, expect_error: InvalidState}
      - {call: enter_pin, args: {pin: "1234"}, expect_error: InvalidState}
      - {call: eject, expect_error: InvalidState}
      - {call: insert_card, args: {card: C1}}
      - {call: insert_card, args: {card: C2}, expect_error: InvalidState}
      - {call: withdraw, args: {amount: 100}, expect_error: InvalidState}
      - {call: enter_pin, args: {pin: "1234"}}
      - {call: enter_pin, args: {pin: "1234"}, expect_error: InvalidState}
      - {call: eject}
      - {call: deposit, args: {amount: 100}, expect_error: InvalidState}
  - name: unknown_card
    steps:
      - {call: insert_card, args: {card: XX}, expect_error: UnknownCard}
      - {call: insert_card, args: {card: C1}}
  - name: cannot_dispense_keeps_state
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1234"}}
      - {call: withdraw, args: {amount: 150}, expect_error: CannotDispense}
      - {call: balance, expect: 10000}
      - {call: cash, expect: 7000}
  - name: fewest_notes_when_large_run_out
    config:
      notes: {2000: 1, 500: 3, 200: 5}
      accounts: [{card: C1, pin: "1", balance: 100000}]
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}}
      - {call: withdraw, args: {amount: 3600}, expect: [{value: 2000, count: 1}, {value: 500, count: 2}, {value: 200, count: 3}]}
      - {call: withdraw, args: {amount: 700}, expect: [{value: 500, count: 1}, {value: 200, count: 1}]}
      - {call: withdraw, args: {amount: 400}, expect_error: CannotDispense}
  - name: exact_dispense_when_greedy_fails
    config:
      notes: {500: 1, 200: 4}
      accounts: [{card: C1, pin: "1", balance: 100000}]
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}}
      - {call: withdraw, args: {amount: 800}, expect: [{value: 200, count: 4}]}
      - {call: cash, expect: 500}
  - name: invalid_amounts
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1234"}}
      - {call: withdraw, args: {amount: 0}, expect_error: InvalidAmount}
      - {call: deposit, args: {amount: -5}, expect_error: InvalidAmount}
  - name: check_order_funds_before_dispense
    steps:
      - {call: insert_card, args: {card: C2}}
      - {call: enter_pin, args: {pin: "0000"}}
      - {call: withdraw, args: {amount: 350}, expect_error: InsufficientFunds}
  - name: deposit_then_withdraw
    steps:
      - {call: insert_card, args: {card: C2}}
      - {call: enter_pin, args: {pin: "0000"}}
      - {call: deposit, args: {amount: 700}, expect: 1000}
      - {call: withdraw, args: {amount: 1000}, expect: [{value: 500, count: 2}]}
      - {call: balance, expect: 0}
  - name: atm_runs_dry
    config:
      notes: {100: 3}
      accounts: [{card: C1, pin: "1", balance: 100000}]
    steps:
      - {call: insert_card, args: {card: C1}}
      - {call: enter_pin, args: {pin: "1"}}
      - {call: withdraw, args: {amount: 300}}
      - {call: withdraw, args: {amount: 100}, expect_error: CannotDispense}
      - {call: cash, expect: 0}
