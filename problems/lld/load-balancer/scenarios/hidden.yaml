scenarios:
  - name: smooth_weighted_round_robin
    steps:
      - {call: add_server, args: {server_id: a, weight: 5}}
      - {call: add_server, args: {server_id: b, weight: 1}}
      - {call: add_server, args: {server_id: c, weight: 1}}
      - {call: set_strategy, args: {strategy: WEIGHTED_ROUND_ROBIN}}
      - {call: acquire, expect: a}
      - {call: acquire, expect: a}
      - {call: acquire, expect: b}
      - {call: acquire, expect: a}
      - {call: acquire, expect: c}
      - {call: acquire, expect: a}
      - {call: acquire, expect: a}
      - {call: acquire, expect: a}
  - name: round_robin_skips_unhealthy
    steps:
      - {call: add_server, args: {server_id: a, weight: 1}}
      - {call: add_server, args: {server_id: b, weight: 1}}
      - {call: add_server, args: {server_id: c, weight: 1}}
      - {call: acquire, expect: a}
      - {call: set_healthy, args: {server_id: b, healthy: false}}
      - {call: acquire, expect: c}
      - {call: acquire, expect: a}
      - {call: set_healthy, args: {server_id: b, healthy: true}}
      - {call: acquire, expect: b}
  - name: all_unhealthy
    steps:
      - {call: add_server, args: {server_id: a, weight: 1}}
      - {call: set_healthy, args: {server_id: a, healthy: false}}
      - {call: acquire, expect_error: NoHealthyServer}
  - name: removed_server_never_picked
    steps:
      - {call: add_server, args: {server_id: a, weight: 1}}
      - {call: add_server, args: {server_id: b, weight: 1}}
      - {call: acquire, expect: a}
      - {call: remove_server, args: {server_id: b}}
      - {call: acquire, expect: a}
      - {call: active, args: {server_id: b}, expect_error: UnknownServer}
      - {call: remove_server, args: {server_id: b}, expect_error: UnknownServer}
  - name: least_connections_tie_lowest_id
    steps:
      - {call: add_server, args: {server_id: z, weight: 1}}
      - {call: add_server, args: {server_id: m, weight: 1}}
      - {call: set_strategy, args: {strategy: LEAST_CONNECTIONS}}
      - {call: acquire, expect: m}
      - {call: acquire, expect: z}
      - {call: acquire, expect: m}
  - name: release_rules
    steps:
      - {call: add_server, args: {server_id: a, weight: 1}}
      - {call: release, args: {server_id: a}, expect_error: InvalidState}
      - {call: release, args: {server_id: q}, expect_error: UnknownServer}
  - name: switching_strategy_resets
    steps:
      - {call: add_server, args: {server_id: a, weight: 1}}
      - {call: add_server, args: {server_id: b, weight: 1}}
      - {call: acquire, expect: a}
      - {call: set_strategy, args: {strategy: ROUND_ROBIN}}
      - {call: acquire, expect: a}
  - name: server_validation
    steps:
      - {call: add_server, args: {server_id: a, weight: 0}, expect_error: InvalidWeight}
      - {call: add_server, args: {server_id: a, weight: 2}}
      - {call: add_server, args: {server_id: a, weight: 2}, expect_error: DuplicateServer}
      - {call: set_healthy, args: {server_id: x, healthy: true}, expect_error: UnknownServer}
  - name: weighted_respects_health
    steps:
      - {call: add_server, args: {server_id: a, weight: 3}}
      - {call: add_server, args: {server_id: b, weight: 1}}
      - {call: set_strategy, args: {strategy: WEIGHTED_ROUND_ROBIN}}
      - {call: set_healthy, args: {server_id: a, healthy: false}}
      - {call: acquire, expect: b}
      - {call: acquire, expect: b}
