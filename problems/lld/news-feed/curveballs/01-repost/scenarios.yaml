scenarios:
  - name: reposts_reach_followers_once
    steps:
      - {call: post, args: {user: a, post_id: p1}}
      - {call: post, args: {user: b, post_id: p2}}
      - {call: follow, args: {follower: c, followee: b}}
      - {call: feed, args: {user: c, limit: 10}, expect: [p2]}
      - {call: repost, args: {user: b, post_id: p1}, expect: true}
      - {call: feed, args: {user: c, limit: 10}, expect: [p1, p2]}
      - {call: repost, args: {user: b, post_id: p1}, expect: false}
      - {call: post, args: {user: a, post_id: p3}}
      - {call: follow, args: {follower: c, followee: a}}
      - {call: feed, args: {user: c, limit: 10}, expect: [p3, p1, p2]}
      - {call: feed, args: {user: c, limit: 2}, expect: [p3, p1]}
      - {call: feed, args: {user: b, limit: 10}, expect: [p1, p2]}
  - name: delete_removes_reposts
    steps:
      - {call: post, args: {user: a, post_id: p1}}
      - {call: post, args: {user: b, post_id: p2}}
      - {call: repost, args: {user: b, post_id: p1}}
      - {call: follow, args: {follower: c, followee: b}}
      - {call: delete, args: {user: a, post_id: p1}}
      - {call: feed, args: {user: c, limit: 10}, expect: [p2]}
      - {call: repost, args: {user: b, post_id: p1}, expect_error: UnknownPost}
      - {call: repost, args: {user: b, post_id: nope}, expect_error: UnknownPost}
