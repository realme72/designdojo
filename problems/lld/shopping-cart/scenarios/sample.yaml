scenarios:
  - name: plain_bill
    steps:
      - {call: add_product, args: {sku: apple, name: Apple, price: 100}}
      - {call: add_product, args: {sku: bread, name: Bread, price: 250}}
      - {call: add_to_cart, args: {cart_id: c, sku: bread, qty: 1}}
      - {call: add_to_cart, args: {cart_id: c, sku: apple, qty: 3}}
      - call: bill
        args: {cart_id: c}
        expect:
          subtotal: 550
          discount: 0
          total: 550
          lines: [{sku: apple, qty: 3, unit_price: 100, line_total: 300}, {sku: bread, qty: 1, unit_price: 250, line_total: 250}]
  - name: percent_off_sku
    steps:
      - {call: add_product, args: {sku: apple, name: Apple, price: 100}}
      - {call: add_promotion, args: {promo: {code: APL10, kind: PERCENT_OFF_SKU, sku: apple, threshold: 0, value: 10}}}
      - {call: add_to_cart, args: {cart_id: c, sku: apple, qty: 3}}
      - {call: bill, args: {cart_id: c}, expect: {subtotal: 300, discount: 30, total: 270}}
  - name: buy_two_get_one
    steps:
      - {call: add_product, args: {sku: bread, name: Bread, price: 250}}
      - {call: add_promotion, args: {promo: {code: B2G1, kind: BUY_X_GET_Y, sku: bread, threshold: 2, value: 1}}}
      - {call: add_to_cart, args: {cart_id: c, sku: bread, qty: 3}}
      - {call: bill, args: {cart_id: c}, expect: {subtotal: 750, discount: 250, total: 500}}
