[project]
name = "joinery"
version = "0.1.0"
description = "LLD practice playground: design it, get judged, get coached."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
joinery = "joinery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joinery"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker engine"]
